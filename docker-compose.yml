# Keyward sync server behind Caddy (automatic HTTPS via Let's Encrypt).
#
# Production:   KW_DOMAIN=vault.example.com docker compose up -d --build
#   (point the domain's DNS at this host first; ports 80 and 443 must be reachable)
#
# Local try-out: docker compose -f docker-compose.yml -f compose.local.yml up --build
#   then: kw sync register --server http://127.0.0.1:8080 --username you
# After creating your account(s), set KW_REGISTRATION=closed and restart.

services:
  keyward:
    build: .
    image: keyward-server:latest
    restart: unless-stopped
    environment:
      KW_TRUST_PROXY: "true"            # client IPs come from Caddy's X-Forwarded-For
      KW_REGISTRATION: "${KW_REGISTRATION:-open}"
      RUST_LOG: "keyward_server=info,tower_http=info"
    volumes:
      - keyward-data:/data
    expose:
      - "8080"                          # only reachable by Caddy, not published

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - keyward
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Your public domain in production. Defaults to `localhost`, for which
      # Caddy issues a certificate from its own local CA (browsers/curl need -k).
      KW_DOMAIN: "${KW_DOMAIN:-localhost}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  keyward-data:
  caddy-data:
  caddy-config:
