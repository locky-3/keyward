[workspace]
resolver = "3"
members = [
    "crates/keyward-core",
    "crates/keyward-cli",
    "crates/keyward-server",
    "crates/keyward-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
keyward-core = { path = "crates/keyward-core" }
keyward-cli = { path = "crates/keyward-cli" }

# Crypto: audited RustCrypto crates only (digest 0.10 generation).
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
argon2 = { version = "0.5.3", features = ["zeroize"] }
hkdf = "0.12.4"
hmac = "0.12.1"
sha1 = "0.10.6"
sha2 = "0.10.8"
subtle = "2.6"
rand = "0.8.5"
zeroize = { version = "1.8", features = ["derive"] }
secrecy = "0.10.3"

# Encoding / model
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2.6"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
thiserror = "2"

# CLI
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7.3"
arboard = "3.4"
tempfile = "3"
dirs = "6"
shell-words = "1.1"

# Server
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# TUI
ratatui = "0.30"

# Dev
http-body-util = "0.1"
proptest = "1.5"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Argon2 and AES are painfully slow unoptimised; optimise deps even in dev/test.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
